
spring:
  application:
    name: digitalfix-kafka-consumer

  datasource:
    url: "${ORACLE_DB_URL:jdbc:oracle:thin:@//rds-digitalfix.cwy0edjpgutk.us-east-1.rds.amazonaws.com:1521/DIGIFIX}"
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_DB_USER:digitalfix}
    password: "${ORACLE_DB_PASSWORD}"

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}

    consumer:
      group-id: digitalfix-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual_immediate
      concurrency: 3

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.kafka: INFO
    com.digitalfix: DEBUG
